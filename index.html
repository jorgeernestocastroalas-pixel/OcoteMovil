<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ocotemovil — Directorio Local</title>
  <style>
    :root {
      --bg: #000000;
      --panel: #0b1018;
      --surface: #131b26;
      --surface-2: #1c2736;
      --text: #ffffff;
      --muted: #e2e8f0;
      --border: #334155;
      --cat-top: #3b7be8;
      --cat-bot: #1d499e;
      --cat-border: #7aaaff;
      --accent: #ffffff;
      --accent-text: #000000;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: rgba(255, 255, 255, 0.16);
    }

    html, body {
      margin: 0;
      padding: 0;
      background: var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif;
      min-height: 100%;
      font-size: 40px;
      line-height: 1.2;
    }

    .app-shell {
      width: 100%;
      max-width: 1080px;
      margin: 0 auto;
      padding: 20px 16px 240px;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }

    /* Encabezado */
    .header {
      text-align: center;
      padding: 16px 8px 20px;
      border-bottom: 2px solid var(--border);
      margin-bottom: 20px;
    }

    .brand-title {
      margin: 0;
      font-size: 50px;
      font-weight: 900;
      letter-spacing: 0.03em;
      text-transform: uppercase;
      line-height: 1.08;
    }

    .brand-sub {
      margin: 10px 0 0;
      font-size: 40px;
      font-weight: 600;
      color: var(--muted);
      line-height: 1.15;
    }

    /* Zonas de Banners */
    .banner-zone {
      width: 100%;
      background: var(--bg);
      border: 2px solid var(--border);
      border-radius: 14px;
      padding: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    .banner-zone-top {
      margin-bottom: 20px;
    }

    /* Empuja el banner inferior hasta abajo, lejos de los resultados */
    .banner-zone-bottom {
      margin-top: 64px;
      margin-bottom: 24px;
    }

    .banner-frame-728 {
      width: 100%;
      max-width: 728px;
      min-height: 90px;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    .ad-728-slot {
      width: 728px;
      height: 90px;
      transform-origin: center top;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    @media (max-width: 759px) {
      .ad-728-slot {
        transform: scale(0.44);
        margin-bottom: -50px;
      }
      .banner-frame-728 {
        min-height: 52px;
      }
    }

    .cliente-slide {
      width: 100%;
      max-width: 728px;
      background: var(--surface);
      border: 2px solid var(--border);
      border-radius: 12px;
      padding: 14px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 14px;
    }

    .cliente-slide-info {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      width: 100%;
    }

    .cliente-slide-img {
      max-height: 90px;
      max-width: 240px;
      width: auto;
      height: auto;
      object-fit: cover;
      border-radius: 10px;
      display: block;
    }

    .cliente-slide-name {
      font-weight: 800;
      font-size: 40px;
      color: var(--text);
      text-align: center;
      line-height: 1.15;
    }

    .cliente-slide-btn {
      width: 100%;
      background: var(--accent);
      color: var(--accent-text);
      text-decoration: none;
      font-weight: 900;
      font-size: 40px;
      padding: 16px 20px;
      border-radius: 12px;
      min-height: 80px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      text-align: center;
    }

    /* Buscador */
    .search-box {
      margin: 18px 0 22px;
    }

    .search-input {
      width: 100%;
      min-height: 84px;
      padding: 16px 18px;
      font-size: 40px;
      font-weight: 600;
      color: var(--text);
      background: var(--surface);
      border: 2px solid var(--border);
      border-radius: 14px;
      outline: none;
    }

    .search-input:focus {
      border-color: var(--cat-border);
    }

    /* Caja principal de directorio tipo tablero */
    .directory-board {
      background: var(--panel);
      border: 2px solid var(--border);
      border-radius: 16px;
      padding: 18px 14px 24px;
    }

    .board-head {
      text-align: center;
      padding-bottom: 16px;
      margin-bottom: 18px;
      border-bottom: 2px solid var(--border);
    }

    .board-title {
      margin: 0;
      font-size: 50px;
      font-weight: 900;
      letter-spacing: 0.02em;
      text-transform: uppercase;
      line-height: 1.1;
    }

    .board-sub {
      margin: 10px 0 0;
      font-size: 40px;
      font-weight: 600;
      color: var(--muted);
      line-height: 1.18;
    }

    /* Dos columnas para categorías */
    .categories-two-col {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 14px;
    }

    .cat-btn {
      min-height: 110px;
      padding: 14px 10px;
      border-radius: 14px;
      border: 2px solid var(--cat-border);
      background: linear-gradient(180deg, var(--cat-top) 0%, var(--cat-bot) 100%);
      color: var(--text);
      font-size: 40px;
      font-weight: 800;
      line-height: 1.12;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      word-break: break-word;
    }

    .cat-btn.active {
      background: var(--accent);
      color: var(--accent-text);
      border-color: var(--accent);
    }

    /* Despliegue de comercios al tocar una categoría o buscar */
    .results-panel {
      margin-top: 28px;
      padding-top: 22px;
      border-top: 2px solid var(--border);
    }

    .results-topbar {
      display: flex;
      flex-direction: column;
      align-items: stretch;
      gap: 14px;
      margin-bottom: 18px;
    }

    .results-heading {
      margin: 0;
      font-size: 46px;
      font-weight: 900;
      text-transform: uppercase;
      line-height: 1.12;
    }

    .btn-clear-cat {
      min-height: 82px;
      padding: 14px 18px;
      border-radius: 12px;
      border: 2px solid var(--border);
      background: var(--surface-2);
      color: var(--text);
      font-size: 40px;
      font-weight: 800;
      cursor: pointer;
    }

    .cards-list {
      display: flex;
      flex-direction: column;
      gap: 18px;
    }

    .biz-card {
      background: var(--surface);
      border: 2px solid var(--border);
      border-radius: 14px;
      padding: 18px 16px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .biz-name {
      margin: 0;
      font-size: 48px;
      font-weight: 900;
      text-transform: uppercase;
      color: var(--text);
      line-height: 1.12;
    }

    .biz-detail {
      margin: 0;
      font-size: 40px;
      font-weight: 500;
      color: var(--muted);
      line-height: 1.2;
    }

    .biz-actions {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-top: 4px;
    }

    .btn-wa {
      width: 100%;
      min-height: 88px;
      padding: 16px 18px;
      border-radius: 12px;
      border: 2px solid #25d366;
      background: #169c48;
      color: #ffffff;
      font-size: 40px;
      font-weight: 800;
      line-height: 1.15;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      cursor: pointer;
    }

    .btn-modal-open {
      width: 100%;
      min-height: 84px;
      padding: 14px 18px;
      border-radius: 12px;
      border: 2px solid var(--border);
      background: var(--surface-2);
      color: var(--text);
      font-size: 40px;
      font-weight: 800;
      line-height: 1.15;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      text-align: center;
    }

    /* Ventana Modal */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.9);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 14px;
      z-index: 999;
    }

    .modal-backdrop.open {
      display: flex;
    }

    .modal-panel {
      width: 100%;
      max-width: 920px;
      max-height: 92vh;
      overflow-y: auto;
      background: var(--surface);
      border: 2px solid var(--accent);
      border-radius: 16px;
      padding: 20px 16px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .modal-header {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 12px;
    }

    .modal-title {
      margin: 0;
      font-size: 48px;
      font-weight: 900;
      text-transform: uppercase;
      line-height: 1.12;
    }

    .modal-close {
      min-width: 80px;
      min-height: 80px;
      border-radius: 12px;
      border: 2px solid var(--border);
      background: var(--surface-2);
      color: var(--text);
      font-size: 40px;
      font-weight: 900;
      cursor: pointer;
      flex-shrink: 0;
    }

    .modal-wa-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .modal-ad-320 {
      width: 100%;
      display: flex;
      justify-content: center;
      padding-top: 14px;
      border-top: 2px solid var(--border);
    }

    /* Pie fijo inferior con solo los dos botones acordados */
    .footer-bar {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      background: var(--bg);
      border-top: 2px solid var(--border);
      padding: 12px 14px;
      z-index: 900;
    }

    .footer-inner {
      max-width: 1080px;
      margin: 0 auto;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    .footer-btn {
      min-height: 86px;
      padding: 12px 10px;
      border-radius: 12px;
      font-size: 40px;
      font-weight: 800;
      line-height: 1.1;
      text-decoration: none;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
    }

    .footer-btn-add {
      background: var(--accent);
      color: var(--accent-text);
    }

    .footer-btn-support {
      background: var(--surface);
      color: var(--text);
      border: 2px solid var(--accent);
    }

    .status-note {
      color: var(--muted);
      font-size: 40px;
      padding: 12px 6px;
    }
  </style>
</head>
<body>

  <script>
    const SHEET_ID = "11uzHhgbs4NFzdd3e1RfFtQ_wKN-_jGssMcouPk8E1WI";

    const CONFIG = {
      csvDirectorio: `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:csv&sheet=Directorio`,
      csvAnuncios: `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:csv&sheet=Anuncios`,

      waAdmin: "50488362713",
      mensajeAgregarNegocio: "Hola, quiero agregar mi negocio en Ocotemovil",

      // 5 segundos exactos por ciclo cuando existan anunciantes activos
      rotacionMs: 5000,

      adsterra728Key: "94a60368d80726e04cbdceea35d7410e",
      adsterra320Key: "f0790f0b6da44120e1c6c4bc8bcb72bb",
      adsterraSrcBase: "https://bicea.org/22/"
    };

    const FALLBACK_DIRECTORIO = [
      {
        categoria: "Domicilios y Comida",
        negocio: "Pollo Sabroso",
        detalle: "Pollo frito y combos - Barrio Las Flores",
        tel1: "50499887766",
        etiqueta1: "WhatsApp",
        tel2: "50426531122",
        etiqueta2: "WhatsApp 2",
        destacado: "SI",
        mensaje: "Hola, los vi en Ocotemovil, quiero hacer un pedido",
        activo: "SI"
      },
      {
        categoria: "Transporte y Mandados",
        negocio: "Mandaditos Ocotepeque",
        detalle: "Envíos rápidos y compras en Ocotepeque y Sinuapa",
        tel1: "50488776655",
        etiqueta1: "WhatsApp",
        tel2: "",
        etiqueta2: "",
        destacado: "NO",
        mensaje: "Hola, los vi en Ocotemovil, necesito un mandado",
        activo: "SI"
      }
    ];

    const FALLBACK_ANUNCIOS = [];

    let negocios = [];
    let anuncios = [];
    let categoriaActiva = "";
    let textoBusqueda = "";
    const rotadoresActivos = {};

    function construirUrlWa(telefono, mensaje) {
      const limpio = String(telefono || "").replace(/\D/g, "");
      if (!limpio) return "#";
      const texto = encodeURIComponent(mensaje || "Hola, los vi en Ocotemovil");
      return `https://wa.me/${limpio}?text=${texto}`;
    }

    function parseCSV(csvText) {
      const rows = [];
      let currentRow = [];
      let currentVal = "";
      let inQuotes = false;

      for (let i = 0; i < csvText.length; i++) {
        const ch = csvText[i];
        const next = csvText[i + 1];

        if (inQuotes) {
          if (ch === '"' && next === '"') {
            currentVal += '"';
            i++;
          } else if (ch === '"') {
            inQuotes = false;
          } else {
            currentVal += ch;
          }
        } else {
          if (ch === '"') {
            inQuotes = true;
          } else if (ch === ",") {
            currentRow.push(currentVal.trim());
            currentVal = "";
          } else if (ch === "\n" || (ch === "\r" && next === "\n")) {
            currentRow.push(currentVal.trim());
            if (currentRow.some(cell => cell !== "")) {
              rows.push(currentRow);
            }
            currentRow = [];
            currentVal = "";
            if (ch === "\r") i++;
          } else {
            currentVal += ch;
          }
        }
      }

      if (currentVal.length > 0 || currentRow.length > 0) {
        currentRow.push(currentVal.trim());
        if (currentRow.some(cell => cell !== "")) {
          rows.push(currentRow);
        }
      }

      if (rows.length < 2) return [];
      const headers = rows[0].map(h => h.toLowerCase().trim());
      return rows.slice(1).map(r => {
        const obj = {};
        headers.forEach((h, idx) => {
          obj[h] = (r[idx] || "").trim();
        });
        return obj;
      });
    }

    async function cargarCSV(url, fallback) {
      if (!url) return fallback;
      try {
        const resp = await fetch(url, { cache: "no-store" });
        if (!resp.ok) return fallback;
        const text = await resp.text();
        if (text.trim().startsWith("<!DOCTYPE") || text.includes("<html")) return fallback;
        const parsed = parseCSV(text);
        return parsed.length ? parsed : fallback;
      } catch (e) {
        return fallback;
      }
    }

    function montarAdsterra728Estatico(container) {
      if (container.dataset.adsterraMounted === "1") return;
      container.innerHTML = "";
      container.dataset.adsterraMounted = "1";

      const slot = document.createElement("div");
      slot.className = "ad-728-slot";

      const iframe = document.createElement("iframe");
      iframe.width = "728";
      iframe.height = "90";
      iframe.frameBorder = "0";
      iframe.scrolling = "no";
      iframe.style.border = "0";
      iframe.style.background = "#000000";

      iframe.srcdoc = `
        <!DOCTYPE html>
        <html>
        <head><meta charset="utf-8"><style>body{margin:0;padding:0;background:#000;display:flex;justify-content:center;align-items:center;}</style></head>
        <body>
          <script>
            atOptions = {
              'key' : '${CONFIG.adsterra728Key}',
              'format' : 'iframe',
              'height' : 90,
              'width' : 728,
              'params' : {}
            };
          <\/script>
          <script data-cfasync="false" src="${CONFIG.adsterraSrcBase}${CONFIG.adsterra728Key}"><\/script>
        </body>
        </html>
      `;

      slot.appendChild(iframe);
      container.appendChild(slot);
    }

    function renderAdsterra728EnRotacion(container) {
      container.dataset.adsterraMounted = "0";
      container.innerHTML = "";

      const slot = document.createElement("div");
      slot.className = "ad-728-slot";

      const iframe = document.createElement("iframe");
      iframe.width = "728";
      iframe.height = "90";
      iframe.frameBorder = "0";
      iframe.scrolling = "no";
      iframe.style.border = "0";
      iframe.style.background = "#000000";

      iframe.srcdoc = `
        <!DOCTYPE html>
        <html>
        <head><meta charset="utf-8"><style>body{margin:0;padding:0;background:#000;display:flex;justify-content:center;align-items:center;}</style></head>
        <body>
          <script>
            atOptions = {
              'key' : '${CONFIG.adsterra728Key}',
              'format' : 'iframe',
              'height' : 90,
              'width' : 728,
              'params' : {}
            };
          <\/script>
          <script data-cfasync="false" src="${CONFIG.adsterraSrcBase}${CONFIG.adsterra728Key}"><\/script>
        </body>
        </html>
      `;

      slot.appendChild(iframe);
      container.appendChild(slot);
    }

    function renderClienteSlide(container, anuncio) {
      container.dataset.adsterraMounted = "0";
      container.innerHTML = "";

      const card = document.createElement("div");
      card.className = "cliente-slide";

      const info = document.createElement("div");
      info.className = "cliente-slide-info";

      if (anuncio.imagen_url) {
        const img = document.createElement("img");
        img.className = "cliente-slide-img";
        img.src = anuncio.imagen_url;
        img.alt = anuncio.negocio || "Anuncio";
        info.appendChild(img);
      }

      const nombre = document.createElement("span");
      nombre.className = "cliente-slide-name";
      nombre.textContent = anuncio.negocio || "Negocio local";
      info.appendChild(nombre);

      const waLink = document.createElement("a");
      waLink.className = "cliente-slide-btn";
      waLink.href = construirUrlWa(anuncio.whatsapp_tel, anuncio.mensaje_wa);
      waLink.target = "_blank";
      waLink.rel = "noopener";
      waLink.textContent = "WhatsApp";

      card.appendChild(info);
      card.appendChild(waLink);
      container.appendChild(card);
    }

    function iniciarRotadorEspacio(containerId, espacioNombre) {
      if (rotadoresActivos[containerId]) {
        clearInterval(rotadoresActivos[containerId]);
        delete rotadoresActivos[containerId];
      }

      const container = document.getElementById(containerId);
      const activos = anuncios.filter(
        a =>
          (a.espacio || "").toLowerCase().trim() === espacioNombre &&
          (a.activo || "").toUpperCase().trim() === "SI"
      );

      if (!activos.length) {
        montarAdsterra728Estatico(container);
        return;
      }

      const items = [{ tipo: "adsterra" }, ...activos.map(a => ({ tipo: "cliente", data: a }))];
      let idx = 0;

      const mostrarActual = () => {
        const current = items[idx % items.length];
        if (current.tipo === "adsterra") {
          renderAdsterra728EnRotacion(container);
        } else {
          renderClienteSlide(container, current.data);
        }
        idx = (idx + 1) % items.length;
      };

      mostrarActual();
      rotadoresActivos[containerId] = setInterval(mostrarActual, CONFIG.rotacionMs);
    }

    function renderModalBanner320() {
      const modalAd = document.getElementById("modal-ad-container");
      modalAd.innerHTML = "";

      const iframe = document.createElement("iframe");
      iframe.width = "320";
      iframe.height = "50";
      iframe.frameBorder = "0";
      iframe.scrolling = "no";
      iframe.style.border = "0";
      iframe.style.background = "#000000";

      iframe.srcdoc = `
        <!DOCTYPE html>
        <html>
        <head><meta charset="utf-8"><style>body{margin:0;padding:0;background:#000;display:flex;justify-content:center;align-items:center;}</style></head>
        <body>
          <script>
            atOptions = {
              'key' : '${CONFIG.adsterra320Key}',
              'format' : 'iframe',
              'height' : 50,
              'width' : 320,
              'params' : {}
            };
          <\/script>
          <script data-cfasync="false" src="${CONFIG.adsterraSrcBase}${CONFIG.adsterra320Key}"><\/script>
        </body>
        </html>
      `;
      modalAd.appendChild(iframe);
    }

    function abrirModal(item) {
      document.getElementById("modal-title").textContent = item.negocio || "Comercio";
      document.getElementById("modal-detalle").textContent = item.detalle || "";

      const botonesWrap = document.getElementById("modal-botones");
      botonesWrap.innerHTML = "";

      if (item.tel1) {
        const w1 = document.createElement("a");
        w1.className = "btn-wa";
        w1.href = construirUrlWa(item.tel1, item.mensaje);
        w1.target = "_blank";
        w1.rel = "noopener";
        w1.textContent = item.etiqueta1 || "WhatsApp";
        botonesWrap.appendChild(w1);
      }

      if (item.tel2) {
        const w2 = document.createElement("a");
        w2.className = "btn-wa";
        w2.href = construirUrlWa(item.tel2, item.mensaje);
        w2.target = "_blank";
        w2.rel = "noopener";
        w2.textContent = item.etiqueta2 || "WhatsApp 2";
        botonesWrap.appendChild(w2);
      }

      renderModalBanner320();
      document.getElementById("modal-backdrop").classList.add("open");
    }

    function cerrarModal() {
      document.getElementById("modal-backdrop").classList.remove("open");
      document.getElementById("modal-ad-container").innerHTML = "";
    }

    function renderCategorias() {
      const wrap = document.getElementById("categorias");
      wrap.innerHTML = "";

      const activos = negocios.filter(n => (n.activo || "").toUpperCase().trim() === "SI");
      const cats = [...new Set(activos.map(n => n.categoria).filter(Boolean))];

      if (!cats.length) {
        wrap.innerHTML = '<div class="status-note">Sin categorías activas en la hoja.</div>';
        return;
      }

      cats.forEach(cat => {
        const btn = document.createElement("button");
        btn.type = "button";
        btn.className = "cat-btn" + (categoriaActiva === cat ? " active" : "");
        btn.textContent = cat;
        btn.addEventListener("click", () => {
          categoriaActiva = categoriaActiva === cat ? "" : cat;
          renderCategorias();
          renderDespliegue();
        });
        wrap.appendChild(btn);
      });
    }

    function renderDespliegue() {
      const panel = document.getElementById("results-panel");
      const list = document.getElementById("listado");
      const heading = document.getElementById("results-heading");
      const q = textoBusqueda.toLowerCase().trim();

      if (!categoriaActiva && !q) {
        panel.style.display = "none";
        list.innerHTML = "";
        return;
      }

      panel.style.display = "block";
      list.innerHTML = "";

      let filtrados = negocios.filter(n => (n.activo || "").toUpperCase().trim() === "SI");

      if (categoriaActiva) {
        filtrados = filtrados.filter(n => n.categoria === categoriaActiva);
      }

      if (q) {
        filtrados = filtrados.filter(n =>
          `${n.negocio} ${n.detalle} ${n.categoria}`.toLowerCase().includes(q)
        );
      }

      heading.textContent = categoriaActiva
        ? `${categoriaActiva} (${filtrados.length})`
        : `Resultados: "${textoBusqueda}"`;

      if (!filtrados.length) {
        list.innerHTML = '<div class="status-note">No hay comercios para mostrar aquí.</div>';
        return;
      }

      filtrados.forEach(item => {
        const card = document.createElement("article");
        card.className = "biz-card";

        const h3 = document.createElement("h4");
        h3.className = "biz-name";
        h3.textContent = item.negocio;

        const p = document.createElement("p");
        p.className = "biz-detail";
        p.textContent = item.detalle;

        const actions = document.createElement("div");
        actions.className = "biz-actions";

        if (item.tel1) {
          const waBtn = document.createElement("a");
          waBtn.className = "btn-wa";
          waBtn.href = construirUrlWa(item.tel1, item.mensaje);
          waBtn.target = "_blank";
          waBtn.rel = "noopener";
          waBtn.textContent = item.etiqueta1 || "WhatsApp";
          actions.appendChild(waBtn);
        }

        const btnModal = document.createElement("button");
        btnModal.type = "button";
        btnModal.className = "btn-modal-open";
        btnModal.textContent = item.tel2 ? "Más opciones / Ficha" : "Ver ficha";
        btnModal.addEventListener("click", () => abrirModal(item));
        actions.appendChild(btnModal);

        card.appendChild(h3);
        card.appendChild(p);
        card.appendChild(actions);
        list.appendChild(card);
      });
    }

    async function init() {
      document.getElementById("btn-agregar-negocio").href = construirUrlWa(
        CONFIG.waAdmin,
        CONFIG.mensajeAgregarNegocio
      );

      document.getElementById("buscador").addEventListener("input", e => {
        textoBusqueda = e.target.value;
        renderDespliegue();
      });

      document.getElementById("btn-cerrar-categoria").addEventListener("click", () => {
        categoriaActiva = "";
        textoBusqueda = "";
        document.getElementById("buscador").value = "";
        renderCategorias();
        renderDespliegue();
      });

      document.getElementById("modal-close").addEventListener("click", cerrarModal);
      document.getElementById("modal-backdrop").addEventListener("click", e => {
        if (e.target.id === "modal-backdrop") cerrarModal();
      });

      [negocios, anuncios] = await Promise.all([
        cargarCSV(CONFIG.csvDirectorio, FALLBACK_DIRECTORIO),
        cargarCSV(CONFIG.csvAnuncios, FALLBACK_ANUNCIOS)
      ]);

      renderCategorias();
      renderDespliegue();
      iniciarRotadorEspacio("rotator-arriba", "arriba");
      iniciarRotadorEspacio("rotator-abajo", "abajo");
    }

    init();
  </script>
</body>
</html>
